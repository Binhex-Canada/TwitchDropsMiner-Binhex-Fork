name: Build (macOS arm64)

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  USE_UPX: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Validate language files
        run: |
          failed=()
          for file in "lang/"*.json; do
            if err="$(python -m json.tool "${file}" 2>&1 >/dev/null)"; then
              echo "[OK] ${file}"
            else
              echo "[ERROR] ${file} ${err}"
              failed+=("${file}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo -e "\nFailed to validate the following language file(s): ${failed[@]}"
            exit 1
          fi

      - name: Validate Python sources
        run: |
          python -m compileall -q .
          python - <<'PY'
          import ast
          import symtable
          from pathlib import Path

          failures = []
          for path in Path(".").glob("*.py"):
              source = path.read_text(encoding="utf8")
              tree = ast.parse(source, filename=str(path))
              imports_translation = any(
                  isinstance(node, ast.ImportFrom)
                  and node.module == "translate"
                  and any(
                      alias.name == "_" and alias.asname in (None, "_")
                      for alias in node.names
                  )
                  for node in tree.body
              )
              if not imports_translation:
                  continue

              root = symtable.symtable(source, str(path), "exec")
              pending = list(root.get_children())
              while pending:
                  table = pending.pop()
                  pending.extend(table.get_children())
                  if table.get_type() != "function":
                      continue
                  try:
                      symbol = table.lookup("_")
                  except KeyError:
                      continue
                  # This is the actual failure mode seen in _run(): a normal
                  # function scope both reads translate._ and assigns to _, so
                  # Python treats _ as a local and raises UnboundLocalError.
                  # Comprehensions have their own child scope and are safe.
                  if (
                      symbol.is_local()
                      and symbol.is_assigned()
                      and symbol.is_referenced()
                  ):
                      failures.append(
                          f"{path}:{table.get_lineno()}: "
                          f"{table.get_name()} shadows translate._"
                      )

          if failures:
              raise SystemExit("\n".join(failures))
          PY

  macos:
    name: macOS
    runs-on: macos-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Append git revision to project version
        run: |
          sed -i '' -E "s/^(__version__\s*=\s*\"[^\"]+)/\1.${{steps.vars.outputs.sha_short}}/" version.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install wheel
          python3 -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install pyinstaller

      - name: Create portable executable
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create release folder and Zip
        run: |
          FOLDER="Twitch Drops Miner"
          mkdir -p "$FOLDER"
          cp -r "dist/Twitch Drops Miner (by DevilXD).app" "$FOLDER/"
          cp manual.txt "$FOLDER/"
          zip -r Twitch.Drops.Miner.MacOS.zip "$FOLDER"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.MacOS
          path: Twitch.Drops.Miner.MacOS.zip
